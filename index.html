
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kasir Makanan</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- HEADER -->
    <header>
        <h1>🍽️ Sistem Kasir Makanan</h1>
        <p>Manajemen Data Makanan | Supabase Database</p>
    </header>

    <main class="container">

        <!-- STATISTIK -->
        <section class="stats">

            <div class="stat-card">
                <h3>Jumlah Produk</h3>
                <p id="totalProduk">0</p>
            </div>

            <div class="stat-card">
                <h3>Total Nilai Harga Produk</h3>
                <p id="totalHarga">Rp0</p>
            </div>

        </section>

        <!-- FORM TAMBAH DAN EDIT -->
        <section class="card">

            <h2 id="formTitle">➕ Tambah Makanan</h2>

            <!-- PESAN STATUS -->
            <div id="status" class="status"></div>

            <form id="formMakanan">

                <div class="form-grid">

                    <div>
                        <label for="nama">Nama Makanan</label>
                        <input
                            type="text"
                            id="nama"
                            placeholder="Masukkan nama makanan"
                            required
                        >
                    </div>

                    <div>
                        <label for="harga">Harga Makanan (Rp)</label>
                        <input
                            type="number"
                            id="harga"
                            placeholder="Masukkan harga makanan"
                            min="0"
                            step="1"
                            required
                        >
                    </div>

                </div>

                <div class="form-actions">

                    <button
                        type="submit"
                        class="btn-primary"
                        id="btnSimpan"
                    >
                        💾 Simpan Makanan
                    </button>

                    <button
                        type="button"
                        class="btn-secondary"
                        id="btnBatal"
                        onclick="batalEdit()"
                        style="display: none;"
                    >
                        ❌ Batal Edit
                    </button>

                </div>

            </form>

        </section>

        <!-- TABEL DATA MAKANAN -->
        <section class="card">

            <h2>📋 Data Makanan</h2>

            <!-- SEARCH -->
            <input
                type="text"
                id="search"
                class="search-box"
                placeholder="🔍 Cari nama makanan..."
            >

            <!-- TABEL -->
            <div class="table-wrapper">

                <table>

                    <thead>
                        <tr>
                            <th>ID Makanan</th>
                            <th>Nama Makanan</th>
                            <th>Harga</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>

                    <tbody id="tbody">

                        <tr>
                            <td colspan="4" class="empty">
                                Memuat data...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
